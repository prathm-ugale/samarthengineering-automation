<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="favTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2CE" />
      <stop offset="100%" stop-color="#007C7A" />
    </linearGradient>
    <linearGradient id="favAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB338" />
      <stop offset="100%" stop-color="#F5A524" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#102A43"/>
  
  <g transform="translate(6, 6)">
    <!-- Base Hexagon Ring -->
    <path d="M26 3 L47 15 L47 37 L26 49 L5 37 L5 15 Z" fill="#0b1d2a" stroke="url(#favTeal)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Precision Gear Notches -->
    <path d="M26 0 L26 4" stroke="url(#favTeal)" stroke-width="3" stroke-linecap="round" />
    <path d="M49 13 L45 16" stroke="url(#favTeal)" stroke-width="3" stroke-linecap="round" />
    <path d="M49 39 L45 36" stroke="url(#favTeal)" stroke-width="3" stroke-linecap="round" />
    <path d="M26 52 L26 48" stroke="url(#favTeal)" stroke-width="3" stroke-linecap="round" />
    <path d="M3 39 L7 36" stroke="url(#favTeal)" stroke-width="3" stroke-linecap="round" />
    <path d="M3 13 L7 16" stroke="url(#favTeal)" stroke-width="3" stroke-linecap="round" />

    <!-- Stylized S-Curve Precision Flow -->
    <path d="M36 17 C32 12, 18 12, 17 21 C16 28, 36 26, 35 34 C34 42, 19 41, 15 36" 
          stroke="url(#favTeal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Motion Core Node -->
    <circle cx="26" cy="26" r="4.5" fill="url(#favAmber)" />
    <circle cx="26" cy="26" r="2" fill="#FFFFFF" />
  </g>
